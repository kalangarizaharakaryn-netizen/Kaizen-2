<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04070c;
    --cyan:#4fd8ff;
    --cyan-soft:#8fe9ff;
    --cyan-dim:#1c4f6e;
    --ink:#eaf6ff;
    --glass: rgba(18,40,60,0.35);
    --glass-line: rgba(79,216,255,0.25);
    --mono:'JetBrains Mono', monospace;
    --display:'Orbitron', sans-serif;
  }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;}
  .stage{
    position:relative;
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
  }
  .stage svg{width:92%;height:92%;overflow:visible;position:relative;z-index:1;}
  .glowAura{
    position:absolute; inset:-10%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(79,216,255,0.55) 0%, rgba(79,216,255,0.18) 40%, transparent 72%);
    filter:blur(18px); opacity:0.06; transform:scale(0.9);
    transition:opacity .08s linear, transform .08s linear; z-index:0;
  }
  .glowAura.speaking{
    background:radial-gradient(circle, rgba(255,179,71,0.5) 0%, rgba(79,216,255,0.35) 45%, transparent 72%);
  }
  .core{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .core-title{
    font-family:var(--display); font-weight:700; font-size:22px; letter-spacing:0.12em;
    color:var(--ink); text-shadow:0 0 18px rgba(79,216,255,0.55);
  }
  .core-status{
    margin-top:6px; font-size:10px; letter-spacing:0.3em; color:var(--cyan-soft);
    text-shadow:0 0 8px rgba(79,216,255,0.7);
  }
  .ring-outer{fill:none; stroke:var(--cyan-dim); stroke-width:1.5; opacity:0.45;}
  .ring-accent{fill:none; stroke:var(--cyan-soft); stroke-width:3; stroke-linecap:round; opacity:0.8; filter:drop-shadow(0 0 5px rgba(79,216,255,0.6));}
  .ring-segments{stroke:var(--cyan-dim); stroke-width:5; stroke-dasharray:5 4.5; opacity:0.55;}
  .ring-dotted{stroke:var(--cyan-dim); stroke-width:3; stroke-linecap:round; stroke-dasharray:0.5 11; opacity:0.6;}
  .ring-dashed{stroke:var(--cyan-dim); stroke-width:2; stroke-dasharray:13 9; opacity:0.6;}
  .ring-bracket{fill:none; stroke:var(--cyan-soft); stroke-width:2.5; stroke-linecap:round; opacity:0.85; filter:drop-shadow(0 0 4px rgba(79,216,255,0.6));}
  .ring-inner{
    stroke:var(--cyan); stroke-width:3.5; transform-origin:300px 300px;
    filter:drop-shadow(0 0 10px rgba(79,216,255,0.85)) drop-shadow(0 0 22px rgba(79,216,255,0.4));
  }
  .level-arc{fill:none; stroke:var(--cyan-soft); stroke-width:6; stroke-linecap:round; filter:drop-shadow(0 0 10px rgba(180,240,255,0.95));}
  .core-disc{fill:var(--glass); stroke:var(--glass-line); stroke-width:1;}
</style>
</head>
<body>
<div class="stage">
  <div class="glowAura" id="glowAura"></div>
  <svg id="ringSvg" viewBox="0 0 600 600">
    <g id="outerRingG">
      <path id="outerArc" class="ring-outer" d=""/>
      <path id="accentArc" class="ring-accent" d=""/>
    </g>
    <circle id="segmentRing" class="ring-segments" cx="300" cy="300" r="264" fill="none"/>
    <circle id="dottedRing" class="ring-dotted" cx="300" cy="300" r="230" fill="none"/>
    <g id="bracketsG"></g>
    <path id="levelArc" class="level-arc" d=""/>
    <circle id="dashedRing" class="ring-dashed" cx="300" cy="300" r="178" fill="none"/>
    <circle class="core-disc" cx="300" cy="300" r="140"/>
    <circle id="innerRing" class="ring-inner" cx="300" cy="300" r="148" fill="none"/>
  </svg>
  <div class="core">
    <div class="core-title">KAIZEN</div>
    <div class="core-status" id="statusText">STANDBY</div>
  </div>
</div>
<script>
const CX=300, CY=300;
const svgNS="http://www.w3.org/2000/svg";
function polar(cx,cy,r,angDeg){ const a=(angDeg-90)*Math.PI/180; return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)}; }
function describeArc(cx,cy,r,startAngle,endAngle){
  const s=polar(cx,cy,r,endAngle), e=polar(cx,cy,r,startAngle);
  const largeArc=(endAngle-startAngle)<=180?"0":"1";
  return `M ${s.x.toFixed(2)} ${s.y.toFixed(2)} A ${r} ${r} 0 ${largeArc} 0 ${e.x.toFixed(2)} ${e.y.toFixed(2)}`;
}

document.getElementById('outerArc').setAttribute('d', describeArc(CX,CY,284,-8,258));
document.getElementById('accentArc').setAttribute('d', describeArc(CX,CY,266,198,262));
const outerRingG=document.getElementById('outerRingG');
const segmentRing=document.getElementById('segmentRing');
const dottedRing=document.getElementById('dottedRing');
const dashedRing=document.getElementById('dashedRing');
const innerRing=document.getElementById('innerRing');
const levelArc=document.getElementById('levelArc');
const glowAura=document.getElementById('glowAura');
const statusText=document.getElementById('statusText');
const DOTTED_LEN=2*Math.PI*230, DASHED_LEN=2*Math.PI*178, SEGMENT_LEN=2*Math.PI*264;

const bracketsG=document.getElementById('bracketsG');
[20,110,200,290].forEach(ang=>{
  const p=polar(CX,CY,264,ang), pt=polar(CX,CY,264,ang+3), pr=polar(CX,CY,246,ang);
  const path=document.createElementNS(svgNS,'path');
  path.setAttribute('class','ring-bracket'); path.setAttribute('fill','none');
  path.setAttribute('d', `M ${pt.x.toFixed(2)} ${pt.y.toFixed(2)} L ${p.x.toFixed(2)} ${p.y.toFixed(2)} L ${pr.x.toFixed(2)} ${pr.y.toFixed(2)}`);
  bracketsG.appendChild(path);
});

let mode='standby', rotation=0, level=0, targetLevel=0, phase=0;

// Called from Kotlin: 'standby' | 'listening' | 'thinking' | 'speaking'
window.kaizenSetMode = function(m){
  mode=m;
  statusText.textContent = m.toUpperCase();
  glowAura.classList.toggle('speaking', m==='speaking');
};
// Called from Kotlin with a 0..1 audio level (real mic RMS while listening, a synthetic pulse while speaking)
window.kaizenSetLevel = function(v){ targetLevel = Math.max(0, Math.min(1, v)); };

function frame(){
  rotation += mode==='thinking' ? 1.4 : 0.15;
  outerRingG.setAttribute('transform', `rotate(${rotation*0.4} ${CX} ${CY})`);
  level += (targetLevel-level)*0.18;
  let ambient = mode==='standby' ? (Math.sin(phase*0.05)*0.03+0.03) : 0;
  phase++;

  const sweep = mode==='thinking' ? 40+Math.abs(Math.sin(phase*0.06))*260 : 18+(level+ambient)*300;
  const start=(rotation*1.3)%360;
  levelArc.setAttribute('d', describeArc(CX,CY,204,start,start+Math.min(sweep,340)));

  let avg;
  if(mode==='listening'||mode==='speaking'){ avg=level; }
  else if(mode==='thinking'){ avg=(Math.sin(phase*0.15)+1)/2*0.5; }
  else { avg=ambient*0.6; }
  avg=Math.max(0,Math.min(1,avg));

  const boost = mode==='speaking' ? 1.9 : 1;
  innerRing.style.transform = `scale(${1+avg*0.035*boost})`;
  innerRing.style.strokeWidth = (3.2+avg*4.5*boost).toFixed(1);
  innerRing.style.opacity = 0.75+avg*0.25;

  if(mode==='speaking'){ glowAura.style.opacity=(0.35+avg*0.65).toFixed(2); glowAura.style.transform=`scale(${0.95+avg*0.35})`; }
  else if(mode==='listening'){ glowAura.style.opacity=(0.1+avg*0.35).toFixed(2); glowAura.style.transform=`scale(${0.9+avg*0.2})`; }
  else { glowAura.style.opacity=0.06; glowAura.style.transform='scale(0.9)'; }

  const dashSpeed=(mode==='thinking'||mode==='listening'||mode==='speaking')?2.4:0.6;
  dashedRing.style.strokeDashoffset=((phase*dashSpeed)%DASHED_LEN);
  dottedRing.style.strokeDashoffset=(-(phase*(0.5+avg*1.5))%DOTTED_LEN);
  segmentRing.style.strokeDashoffset=((phase*0.9)%SEGMENT_LEN);
  segmentRing.style.opacity=0.4+avg*0.5;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
      </html>
